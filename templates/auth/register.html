{% extends "base.html" %}
{% block title %}Register — TrekManager{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-3">Register</h3>
        <form method="POST" action="{{ url_for('auth.register') }}">
          <div class="mb-3">
            <label class="form-label">I am registering as</label>
            <select name="role" class="form-select" required>
              <option value="trekker">Trekker (User)</option>
              <option value="staff">Trek Staff</option>
            </select>
            <div class="form-text">Trek Staff accounts need admin approval before you can log in.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contact number</label>
            <input type="text" name="contact" class="form-control" pattern="[0-9+\-\s]{7,15}">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required minlength="4">
          </div>
          <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>
        <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Login here</a>.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
