{% macro render_pagination(pagination, endpoint, extra_args={}) %}
{% if pagination.pages > 1 %}
<nav aria-label="Page navigation">
  <ul class="pagination">
    <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}">
      <a class="page-link" href="{{ url_for(endpoint, page=pagination.prev_num, **extra_args) if pagination.has_prev else '#' }}">Previous</a>
    </li>
    {% for p in pagination.iter_pages() %}
      {% if p %}
        <li class="page-item {% if p == pagination.page %}active{% endif %}">
          <a class="page-link" href="{{ url_for(endpoint, page=p, **extra_args) }}">{{ p }}</a>
        </li>
      {% else %}
        <li class="page-item disabled"><span class="page-link">…</span></li>
      {% endif %}
    {% endfor %}
    <li class="page-item {% if not pagination.has_next %}disabled{% endif %}">
      <a class="page-link" href="{{ url_for(endpoint, page=pagination.next_num, **extra_args) if pagination.has_next else '#' }}">Next</a>
    </li>
  </ul>
</nav>
{% endif %}
{% endmacro %}
