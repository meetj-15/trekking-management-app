{% extends "base.html" %}
{% block title %}{{ 'Edit' if trek else 'New' }} Trek{% endblock %}
{% block content %}
<h2 class="mb-4">{{ 'Edit Trek' if trek else 'New Trek' }}</h2>

<form method="POST" class="row g-3" style="max-width: 640px;">
  <div class="col-md-8">
    <label class="form-label">Trek name</label>
    <input type="text" name="name" class="form-control" required value="{{ trek.name if trek else '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Difficulty</label>
    <select name="difficulty" class="form-select" required>
      {% for d in ['Easy', 'Moderate', 'Hard'] %}
        <option value="{{ d }}" {% if trek and trek.difficulty == d %}selected{% endif %}>{{ d }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-8">
    <label class="form-label">Location</label>
    <input type="text" name="location" class="form-control" required value="{{ trek.location if trek else '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Duration (days)</label>
    <input type="number" name="duration_days" min="1" max="60" class="form-control" required
           value="{{ trek.duration_days if trek else 1 }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Total slots</label>
    <input type="number" name="total_slots" min="1" max="500" class="form-control" required
           value="{{ trek.total_slots if trek else '' }}">
    {% if trek %}
      <div class="form-text">Currently {{ trek.available_slots }} available out of {{ trek.total_slots }}.</div>
    {% endif %}
  </div>
  <div class="col-md-3">
    <label class="form-label">Start date</label>
    <input type="date" name="start_date" class="form-control" value="{{ trek.start_date if trek else '' }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">End date</label>
    <input type="date" name="end_date" class="form-control" value="{{ trek.end_date if trek else '' }}">
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">{{ 'Save changes' if trek else 'Create trek' }}</button>
    <a href="{{ url_for('admin.list_treks') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
